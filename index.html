<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Happy Birthday Huỳnh Như 🎂</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ffd6ea,#fff0f7);
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
background:#fff;
width:100%;
max-width:700px;
border-radius:25px;
padding:30px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.18);
position:relative;
z-index:2;
}

h1{
color:#ff4f93;
margin-bottom:10px;
font-size:40px;
}

h2{
color:#ff77aa;
margin-bottom:20px;
}

.avatar{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
border:6px solid #ff69b4;
box-shadow:0 0 25px pink;
margin:20px auto;
display:block;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{
box-shadow:0 0 15px #ff69b4;
}
to{
box-shadow:0 0 40px hotpink;
}
}

p{
font-size:18px;
line-height:1.8;
color:#555;
margin-top:10px;
}

button{
margin-top:20px;
background:#ff4f93;
color:#fff;
border:none;
padding:15px 35px;
font-size:22px;
border-radius:40px;
cursor:pointer;
transition:.3s;
animation:pulse 1.3s infinite;
}

button:hover{
transform:scale(1.08);
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

#gift{
display:none;
margin-top:25px;
}

.money{
font-size:50px;
font-weight:bold;
color:#e91e63;
margin:15px 0;
}

#qr{
width:220px;
border-radius:18px;
box-shadow:0 0 20px pink;
margin-top:15px;
}

.heart{
position:fixed;
animation:fly 5s linear forwards;
z-index:999;
}

@keyframes fly{
from{
transform:translateY(100vh);
opacity:1;
}
to{
transform:translateY(-10vh);
opacity:0;
}
}

</style>
</head>

<body>

<div class="card">

<h1>🎂 Happy Birthday 🎂</h1>

<h2>Huỳnh Như 💖</h2>

<img src="avatar.JPG" class="avatar">

<p>

💝 Chúc em gái của Trân Trân tuổi mới thật nhiều niềm vui,
luôn luôn mạnh khỏe,
hạnh phúc,
xinh đẹp
và đạt được mọi điều mình mong muốn.

</p>

<button onclick="openGift()">

🎁 MỞ QUÀ

</button>

<div id="gift">

<h2>🎉 Quà Sinh Nhật 🎉</h2>

<div id="money" class="money">

0đ

</div>

<p><b>500.000đ 💝</b></p>

<p>From: Trân Trân ❤️</p>

<h3>📱 Quét mã để nhận quà</h3>

<img src="qr.jpg" id="qr">

</div>

</div>

<audio id="bgm" loop>

<source src="music.mp3" type="audio/mpeg">

</audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script>

let started=false;

function openGift(){

if(started) return;

started=true;

document.getElementById("gift").style.display="block";

document.getElementById("bgm").play().catch(()=>{});

confetti({

particleCount:180,

spread:120,

origin:{y:0.6}

});

setInterval(()=>{
 confetti({

particleCount:18,

spread:120,

origin:{

x:Math.random(),

y:Math.random()*0.6

}

});

},400);

let value=0;

const target=500000;

const timer=setInterval(()=>{

value+=5000;

if(value>=target){

value=target;

clearInterval(timer);

}

document.getElementById("money").innerText=

value.toLocaleString("vi-VN")+"đ";

},15);

for(let i=0;i<120;i++){

setTimeout(()=>{

let h=document.createElement("div");

h.className="heart";

h.innerHTML=Math.random()>0.5?"💖":"🎉";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(18+Math.random()*22)+"px";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},5000);

},i*40);

}
 </script>

</body>

</html>
